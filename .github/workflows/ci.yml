name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # 无凭据也能跑的门禁：语法、单测、golden set 静态校验
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: uv sync --frozen

      - name: 语法检查
        run: uv run python -m compileall -q app scripts tests

      # 这个仓库被 import 期炸掉坑过两次（torch DLL、fastembed SEGFAULT），
      # 语法检查发现不了，必须真把服务和 worker 导一遍
      - name: 服务与 worker 可导入
        run: uv run python -c "import app.query_process.api.query_service, app.query_process.worker, app.import_process.api.file_import_service, app.import_process.worker"

      - name: 单测
        run: uv run python -m pytest tests/ -q

      - name: golden set 静态校验
        run: uv run python scripts/check_golden.py

  # 需要真实凭据的指标门禁：配了 secrets 才跑，否则跳过
  rag-eval:
    runs-on: ubuntu-latest
    needs: static
    if: ${{ vars.ENABLE_RAG_EVAL == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: uv sync --frozen

      - name: 检索评测
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          RERANK_API_KEY: ${{ secrets.RERANK_API_KEY }}
          MILVUS_URL: ${{ secrets.MILVUS_URL }}
          MILVUS_TOKEN: ${{ secrets.MILVUS_TOKEN }}
          PG_ENABLED: "true"
          PG_DSN: ${{ secrets.PG_DSN }}
        run: uv run python scripts/eval_retrieval.py --pipelines all --k 5

      - name: 指标门禁
        run: uv run python scripts/gate_metrics.py --pipeline full
